apiVersion: batch/v1
kind: CronJob
metadata:
  name: periodic-sync
  namespace: web
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: periodic-sync
        spec:
          nodeSelector:
            kubernetes.io/hostname: wushuang-vmware-virtual-platform
          restartPolicy: Never
          containers:
            - name: periodic-sync
              image: docker.io/local/k8s-port-audit:0.2.2-bylw
              imagePullPolicy: Never
              command: ["python", "/lab/cron.py"]
              env:
                - name: CRON_TARGET_HOST
                  value: db.web.svc.cluster.local
                - name: CRON_TARGET_PORT
                  value: "6379"
              volumeMounts:
                - name: scripts
                  mountPath: /lab
          volumes:
            - name: scripts
              configMap:
                name: thesis-lab-scripts
