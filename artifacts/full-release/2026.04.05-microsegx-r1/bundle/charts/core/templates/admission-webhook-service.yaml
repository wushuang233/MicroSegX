apiVersion: v1
kind: Service
metadata:
  name: microsegx-svc-admission-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 443
      targetPort: 20443
      protocol: TCP
      name: admission-webhook
  type: {{ .Values.admissionwebhook.type }}
  selector:
    app: microsegx-controller-pod