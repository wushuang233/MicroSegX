    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
roleRef:
{{- if not $oc3 }}
  apiGroup: rbac.authorization.k8s.io
  kind: Role
{{- end }}
  name: microsegx-binding-cert-upgrader
subjects:
- kind: ServiceAccount
  name: cert-upgrader
  namespace: {{ .Release.Namespace }}
{{- if $oc3 }}
userNames:
- system:serviceaccount:{{ .Release.Namespace }}:cert-upgrader
{{- end }}
{{- end }}
---
{{- if $oc3 }}
apiVersion: authorization.openshift.io/v1
{{- else if (semverCompare ">=1.8-0" (substr 1 -1 .Capabilities.KubeVersion.GitVersion)) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- else }}
apiVersion: v1
{{- end }}
kind: RoleBinding
metadata:
  name: microsegx-binding-secret
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
roleRef:
{{- if not $oc3 }}
  apiGroup: rbac.authorization.k8s.io
  kind: Role
{{- end }}
  name: microsegx-binding-secret
subjects:
- kind: ServiceAccount
  name: controller
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: enforcer
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: scanner
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: registry-adapter
  namespace: {{ .Release.Namespace }}
{{- if $oc3 }}
userNames:
- system:serviceaccount:{{ .Release.Namespace }}:controller
- system:serviceaccount:{{ .Release.Namespace }}:enforcer
- system:serviceaccount:{{ .Release.Namespace }}:scanner
- system:serviceaccount:{{ .Release.Namespace }}:registry-adapter
