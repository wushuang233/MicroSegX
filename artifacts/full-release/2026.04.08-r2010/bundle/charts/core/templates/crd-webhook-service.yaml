{{- if .Values.crdwebhooksvc.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: microsegx-svc-crd-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 443
      targetPort: 30443
      protocol: TCP
      name: crd-webhook
  type: {{ .Values.crdwebhook.type }}
  selector:
    app: microsegx-controller-pod
{{- end }}
