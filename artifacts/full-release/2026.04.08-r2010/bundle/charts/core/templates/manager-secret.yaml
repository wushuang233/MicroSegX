{{- if .Values.manager.enabled -}}
{{- if or (eq "true" (toString .Values.autoGenerateCert)) (and .Values.manager.certificate.key .Values.manager.certificate.certificate) }}
{{- $cert := (dict) }}
{{- if and .Values.manager.certificate.key .Values.manager.certificate.certificate }}
{{- $cert = (dict "Key" .Values.manager.certificate.key "Cert" .Values.manager.certificate.certificate ) }}
{{- else }}
{{- $cn := "microsegx" }}
{{- $cert = genSelfSignedCert $cn nil (list $cn) (.Values.defaultValidityPeriod | int) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: microsegx-manager-secret
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
type: Opaque
data:
  ssl-cert.key: {{ include "microsegx.secrets.lookup" (dict "namespace" .Release.Namespace "secret" "microsegx-manager-secret" "key" "ssl-cert.key" "defaultValue" $cert.Key) }}
  ssl-cert.pem: {{ include "microsegx.secrets.lookup" (dict "namespace" .Release.Namespace "secret" "microsegx-manager-secret" "key" "ssl-cert.pem" "defaultValue" $cert.Cert) }}
---
{{- end }}
{{- end }}
