{{- if .Values.controller.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: microsegx-init
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
data:
{{ toYaml .Values.controller.configmap.data | indent 2 }}
{{- end }}
