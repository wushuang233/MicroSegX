# Custom values for MicroSegX deployment
# Using local images (no registry prefix for k3s)

openshift: false

registry: ""
tag: test-1775467413

# Disable Azure/AWS marketplace features
global:
  azure:
    enabled: false
  aws:
    enabled: false

# Controller configuration
controller:
  enabled: true
  replicas: 1
  hostNetwork: false
  strategy:
    type: Recreate
    rollingUpdate: null
  pvc:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClass: local-path
    capacity: 2Gi
  image:
    repository: local/controller
    imagePullPolicy: Never
  apisvc:
    type: ClusterIP
    ctrlServerPort: 10443
  disruptionbudget: 0

# Enforcer configuration
enforcer:
  enabled: true
  hostNetwork: false
  image:
    repository: microsegx/enforcer
    imagePullPolicy: Never
  securityContext:
    privileged: true

# Manager configuration
manager:
  enabled: true
  image:
    repository: microsegx/manager
    imagePullPolicy: Never
  env:
    ssl: false
  svc:
    type: NodePort
    mgrServerPort: 8443
    nodePort: 30084

# CVE Scanner configuration
cve:
  scanner:
    enabled: true
    replicas: 1
    image:
      repository: microsegx/scanner
      tag: dev-cvedb
      imagePullPolicy: Never
  updater:
    enabled: false
    image:
      repository: microsegx/updater
      tag: dev
      imagePullPolicy: Never

# Service account
serviceAccount: default
rbac: true

# Auto generate certificates
autoGenerateCert: true

# Runtime path for containerd (k3s default)
runtimePath: /run/k3s/containerd/containerd.sock

# Namespace for deployment
namespace: microsegx
