{{- if and .Values.cve.updater.enabled .Values.rbac (not .Values.leastPrivilege) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: updater
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microsegx-updater
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - microsegx-scanner-pod
  verbs:
  - get
  - patch
  - update

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microsegx-updater
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: microsegx-updater
subjects:
- kind: ServiceAccount
  name: updater
  namespace: {{ .Release.Namespace }}
{{- end }}
