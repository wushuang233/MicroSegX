{{- if and .Values.rbac (not .Values.leastPrivilege) .Values.cve.scanner.enabled -}}
{{- $oc4 := and .Values.openshift (semverCompare ">=1.12-0" (substr 1 -1 .Capabilities.KubeVersion.GitVersion)) -}}
{{- $oc3 := and .Values.openshift (not $oc4) (semverCompare ">=1.9-0" (substr 1 -1 .Capabilities.KubeVersion.GitVersion)) -}}
{{- if $oc3 }}
apiVersion: authorization.openshift.io/v1
{{- else if (semverCompare ">=1.8-0" (substr 1 -1 .Capabilities.KubeVersion.GitVersion)) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- else }}
apiVersion: v1
{{- end }}
kind: Role
metadata:
  name: microsegx-binding-scanner
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - watch
  - patch
  - update

---
{{- if $oc3 }}
apiVersion: authorization.openshift.io/v1
{{- else if (semverCompare ">=1.8-0" (substr 1 -1 .Capabilities.KubeVersion.GitVersion)) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- else }}
apiVersion: v1
{{- end }}
kind: RoleBinding
metadata:
  name: microsegx-binding-scanner
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "microsegx.chart" . }}
    release: {{ .Release.Name }}
roleRef:
{{- if not $oc3 }}
  apiGroup: rbac.authorization.k8s.io
  kind: Role
{{- end }}
  name: microsegx-binding-scanner
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.cve.updater.enabled }}
- kind: ServiceAccount
  name: updater
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $oc3 }}
userNames:
- system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.serviceAccount }}
{{- if .Values.cve.updater.enabled }}
- system:serviceaccount:{{ .Release.Namespace }}:updater
{{- end }}
{{- end }}
{{- end }}
