<div class="screen-area waf-page">
  <div
    *ngIf="source !== navSource['FED_POLICY']"
    class="waf-page__header d-flex justify-content-between align-items-center">
    <h1 class="font-weight-light">
      {{ 'sidebar.nav.WAF_SENSORS' | translate }}
    </h1>
    <div class="waf-sensors-toolbar">
      <button
        mat-button
        aria-label="export WAF SENSORS"
        *appDisplayControl="'review_rule'"
        (click)="exportWafSensors()">
        <em class="eos-icons icon-18 me-1">download</em>
        {{ 'admissionControl.EXPORT' | translate }}
      </button>
      <button
        mat-button
        aria-label="import WAF SENSORS"
        (click)="openImportWafSensorsModal()"
        *appDisplayControl="'write_waf_rule'">
        <em class="eos-icons icon-18 me-1">upload</em>
        {{ 'admissionControl.IMPORT' | translate }}
      </button>
      <app-loading-button
        (btnClick)="refresh()"
        [appearance]="'mat-button'"
        [buttonClasses]="'d-flex justify-content-center align-items-center'"
        [disabled]="false"
        [iconClasses]="'eos-icons icon-18'"
        [iconName]="'refresh'"
        [id]="'waf-refresh-button'"
        [loading]="false"
        [text]="'network.REFRESH' | translate"
        [type]="'button'">
      </app-loading-button>
    </div>
  </div>
  <ng-container>
    <app-adjustable-div
      [source]="source"
      [minHeightOne]="190"
      [minHeightTwo]="260">
      <ng-container *appContainerOne="let height">
        <mat-card
          [ngStyle]="{ height: height + 'px', width: '100%', minWidth: '0' }"
          class="waf-card waf-card--list">
          <div class="waf-card__toolbar">
            <div class="waf-card__toolbar-meta">
              <span class="font-weight-bold text-info waf-card__count">
                <span *ngIf="filtered">
                  {{ 'enum.FOUND' | translate }}
                  {{ filteredCount }}&nbsp;/
                </span>
                <span *ngIf="!filtered">
                  {{ 'enum.OUT_OF' | translate }}&nbsp;
                </span>
                {{ wafSensorsCount }}
              </span>
            </div>
            <div class="waf-card__toolbar-actions">
              <div
                *ngIf="source === navSource['FED_POLICY']"
                class="waf-card__toolbar-batch">
                <button
                  mat-button
                  aria-label="export WAF SENSORS"
                  *appDisplayControl="'review_rule'"
                  (click)="exportWafSensors()">
                  <em class="eos-icons icon-18 me-1">download</em>
                  {{ 'admissionControl.EXPORT' | translate }}
                </button>
                <button
                  mat-button
                  aria-label="import WAF SENSORS"
                  (click)="openImportWafSensorsModal()"
                  *appDisplayControl="'write_waf_rule'">
                  <em class="eos-icons icon-18 me-1">upload</em>
                  {{ 'admissionControl.IMPORT' | translate }}
                </button>
              </div>
              <button
                mat-stroked-button
                aria-label="add sensor"
                class="waf-card__toolbar-button"
                (click)="openAddEditWafSensorModal()"
                *appDisplayControl="'write_waf_rule'">
                <em class="eos-icons icon-18">add_circle</em>
                {{ 'admissionControl.INSERT' | translate }}
              </button>
              <app-quick-filter
                class="waf-card__filter"
                [gridOptions]="gridOptions4Sensors"
                [gridApi]="gridApi4Sensors"
                (filterCountChange)="filterCountChanged($event)"
                [showCount]="false">
              </app-quick-filter>
            </div>
          </div>
          <div class="waf-card__grid">
            <ag-grid-angular
              id="waf-sensors-grid"
              style="width: 100%; height: 100%"
              class="ag-theme-balham"
              [gridOptions]="gridOptions4Sensors"
              [rowData]="wafSensors"
              [context]="context">
            </ag-grid-angular>
          </div>
        </mat-card>
      </ng-container>
      <ng-container *appContainerTwo="let height">
        <mat-card
          [ngStyle]="{ height: height + 'px', width: '100%', minWidth: '0' }"
          *ngIf="selectedSensor"
          class="waf-card waf-card--detail">
          <div class="waf-card__detail-title">
            <label class="panel-text-title mt-sm">
              {{ selectedSensor.name | shortenFromMiddle: 30 }}
            </label>
          </div>
          <div class="waf-detail-grid">
            <section
              class="waf-detail-grid__column waf-detail-grid__column--rules">
              <div class="waf-detail-grid__header">
                <span class="waf-detail-grid__title">规则</span>
                <button
                  *ngIf="
                    !isPredefine &&
                    isWriteWAFSensorAuthorized &&
                    ((source !== navSource.FED_POLICY &&
                      selectedSensor.cfg_type !== CFG_TYPE.FED) ||
                      (source === navSource.FED_POLICY &&
                        selectedSensor.cfg_type === CFG_TYPE.FED))
                  "
                  mat-stroked-button
                  class="waf-detail-grid__add"
                  (click)="openAddWafRuleModal()">
                  <em
                    class="eos-icons icon-18 d-flex justify-content-center align-items-center"
                    >add</em
                  >
                  新增规则
                </button>
              </div>
              <div class="waf-detail-grid__table">
                <ag-grid-angular
                  id="waf-rules-grid"
                  style="width: 100%; height: 100%"
                  class="ag-theme-balham"
                  [gridOptions]="gridOptions4Rules"
                  [context]="context">
                </ag-grid-angular>
              </div>
            </section>
            <section
              class="waf-detail-grid__column waf-detail-grid__column--patterns">
              <div class="waf-detail-grid__header">
                <span class="waf-detail-grid__title">规则内容</span>
              </div>
              <div class="waf-detail-grid__table">
                <ag-grid-angular
                  id="waf-patterns-grid"
                  style="width: 100%; height: 100%"
                  class="ag-theme-balham"
                  [gridOptions]="gridOptions4Patterns"
                  [context]="context">
                </ag-grid-angular>
              </div>
            </section>
          </div>
        </mat-card>
      </ng-container>
    </app-adjustable-div>
  </ng-container>
</div>
